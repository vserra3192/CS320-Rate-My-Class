
# This is a basic workflow from GitHub to help you get started with Actions
# It is needed so that we have at least one check to require so that we can enable
# the "Require branches to be up to date before merging" setting.

# Add this file to your repository as `.github/workflows/ci.yml`

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on pushes to main and pull requests to main or dev
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main", "dev" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Run commands from the Django backend directory
    defaults:
      run:
        working-directory: backend

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Sets up Python for the Django backend
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Installs the backend dependencies
      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # Checks Django project configuration
      - name: Check Django configuration
        run: python manage.py check

      # Runs automated Django tests
      - name: Run Django tests
        run: python manage.py test

      # Verifies that the backend Docker image builds successfully
      - name: Build backend Docker image
        run: docker build -t rate-my-class-backend .
